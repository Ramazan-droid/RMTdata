services:
  backend:
    build: ./backend
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v2.54.1
    ports: ["9095:9090"]
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    depends_on: [backend]
    restart: unless-stopped
